    answer: 0
    explanation: {en: "The qualification's tool list has a rip saw (4-5 TPI) for cutting along the grain and a cross-cut saw (8 TPI) for cutting across it.", hi: "योग्यता की औज़ार-सूची में रेशे की दिशा में काटने के लिए रिप आरी (4-5 TPI) और आर-पार काटने के लिए क्रॉस-कट आरी (8 TPI) है।"}
