    sources: [qp, cts]
    difficulty_prior: -0.2
    stem: {en: "How should you sand a wooden surface for a smooth finish?", hi: "लकड़ी की सतह को चिकना करने के लिए रेगमाल कैसे चलाएँ?"}
    options:
