    answer: 0
    explanation: {en: "Seasoning lowers the moisture content, so the wood is more stable, stronger and less likely to warp, crack or decay.", hi: "सीज़निंग से नमी घटती है, लकड़ी स्थिर और मज़बूत होती है और टेढ़ी होने, फटने या सड़ने का ख़तरा कम होता है।"}
