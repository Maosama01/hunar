    answer: 0
    explanation: {en: "Sanding along the grain avoids scratches; finer grades remove the marks left by coarser ones. The qualification asks for suitable sanding papers and tools.", hi: "रेशे की दिशा में रगड़ने से खरोंच नहीं आती; बारीक रेगमाल मोटे के निशान हटाता है। योग्यता में सही रेगमाल और औज़ार का इस्तेमाल माँगा गया है।"}
