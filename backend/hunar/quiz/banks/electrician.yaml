    answer: 0
    explanation: {en: "CEA reg. 21(2) lists rubber gloves and safety footwear suitable for the working voltage among required PPE.", hi: "CEA नियम 21(2) में काम के वोल्टेज के लायक रबर दस्ताने और सेफ़्टी जूते ज़रूरी PPE में हैं।"}
  - id: el-034
    nos: CON/N9001
    pc_refs: [CON/N9001.PC5]
    sources: [qp, dgt1]
    difficulty_prior: -0.6
    stem: {en: "An electrical panel catches fire. Which extinguisher must NOT be used?", hi: "बिजली के पैनल में आग लगी है। कौन-सा अग्निशामक इस्तेमाल नहीं करना चाहिए?"}
    options:
      - {en: "Water", hi: "पानी वाला"}
      - {en: "Carbon dioxide (CO₂)", hi: "कार्बन डाइऑक्साइड (CO₂)"}
      - {en: "Dry chemical powder", hi: "ड्राई केमिकल पाउडर"}
    answer: 0
    explanation: {en: "Water conducts electricity and can give the person using it a shock. Switch off the supply and use CO₂ or dry powder.", hi: "पानी में करंट बहता है, इस्तेमाल करने वाले को झटका लग सकता है। सप्लाई बंद करें और CO₂ या ड्राई पाउडर इस्तेमाल करें।"}
  - id: el-035
    nos: CON/N9001
    pc_refs: [CON/N9001.PC2]
    sources: [dgt1, cea30]
    difficulty_prior: -0.9
    stem: {en: "A co-worker is stuck to a live wire. What do you do first?", hi: "एक साथी चालू तार से चिपक गया है। आप सबसे पहले क्या करेंगे?"}
    options:
      - {en: "Switch off the supply, or push him away with a dry non-conducting object", hi: "सप्लाई बंद करें, या सूखी, करंट न बहने वाली चीज़ से उसे अलग करें"}
      - {en: "Pull him away with your bare hands", hi: "नंगे हाथों से उसे खींचें"}
