    answer: 0
    explanation: {en: "Touching him while he is in contact with the supply passes the current to you. Break the contact safely first, then give first aid and call for help.", hi: "जब तक वह सप्लाई से जुड़ा है, उसे छूने से करंट आपको भी लगेगा। पहले सुरक्षित तरीके से संपर्क तोड़ें, फिर प्राथमिक उपचार दें और मदद बुलाएँ।"}
  - id: el-036
