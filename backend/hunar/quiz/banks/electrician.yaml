    sources: [qp, cea21]
    difficulty_prior: -1.8
    stem: {en: "Which PPE protects an electrician's hands from shock?", hi: "कौन-सा PPE इलेक्ट्रीशियन के हाथों को झटके से बचाता है?"}
    options:
      - {en: "Insulated rubber gloves", hi: "इंसुलेटेड रबर के दस्ताने"}
      - {en: "Cotton gloves soaked in water", hi: "पानी में भीगे सूती दस्ताने"}
      - {en: "Metal wrist watch", hi: "धातु की कलाई घड़ी"}
