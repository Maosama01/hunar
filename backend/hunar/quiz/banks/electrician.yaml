      - {en: "A routine event", hi: "रोज़ की बात"}
      - {en: "Good luck", hi: "क़िस्मत अच्छी थी"}
    answer: 0
    explanation: {en: "A near miss could have caused injury; identifying and reporting it helps prevent the next accident.", hi: "नियर मिस से चोट लग सकती थी; उसे पहचानकर रिपोर्ट करने से अगला हादसा रुकता है।"}
  - id: el-037
    nos: CON/N9001
