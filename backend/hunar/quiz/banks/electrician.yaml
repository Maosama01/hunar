    explanation: {en: "Reg. 31(1) exempts only replacing lamps, fans, fuses, switches, domestic appliances up to 250 V and fittings in a way that does not alter the installation. Other work needs a licensed contractor and a permit holder.", hi: "नियम 31(1) में सिर्फ़ बल्ब, पंखे, फ़्यूज़, स्विच, 250 V तक के घरेलू उपकरण और फ़िटिंग बदलने की छूट है, बिना वायरिंग बदले। बाक़ी काम के लिए लाइसेंसधारी ठेकेदार और परमिट धारक चाहिए।"}
