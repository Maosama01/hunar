    difficulty_prior: 0.5
    stem: {en: "A heavy tool falls from a height and lands next to a worker without hitting anyone. What is this called?", hi: "ऊँचाई से भारी औज़ार गिरा और किसी को लगे बिना एक कामगार के पास गिरा। इसे क्या कहते हैं?"}
