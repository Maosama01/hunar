sources:
  qp: "Assistant Electrician qualification file QG-03-CO-03951-2025-V2-CSDCI (NQR 13772), performance criteria as cited per item"
  cea17: "CEA (Measures relating to Safety and Electric Supply) Regulations, 2023, reg. 17 (no switch or fuse in the earthed neutral except a linked switch)"
  cea18: "CEA Safety Regulations 2023, reg. 18 (earthed terminal on consumer's premises)"
  cea20: "CEA Safety Regulations 2023, reg. 20 (danger notices above 250 V)"
  cea21: "CEA Safety Regulations 2023, reg. 21 (discharge/earth before handling; PPE such as rubber gloves, safety footwear, line tester, voltage detector)"
  cea30: "CEA Safety Regulations 2023, reg. 30 (instructions for resuscitation after electric shock)"
  cea31: "CEA Safety Regulations 2023, reg. 31 (who may carry out installation work; exemption for like-for-like replacement)"
  cea35: "CEA Safety Regulations 2023, regs. 35-36 (insulation resistance checked before connection; supply may be cut for leakage)"
  cea37: "CEA Safety Regulations 2023, reg. 37(2) (switch fuse unit or circuit breaker near the point of supply)"
  cea42: "CEA Safety Regulations 2023, reg. 42 (insulation resistance test before reconnecting after addition, alteration or repair)"
  cea43: "CEA Safety Regulations 2023, reg. 43 (earthing: bonding, three-pin earthed sockets, testing before energising, earth fault loop impedance)"
  cea44: "CEA Safety Regulations 2023, reg. 44 (residual current device; not more than 30 mA in domestic installations)"
  ceasch1: "CEA Safety Regulations 2023, Schedule I Part II (permit to work; isolate, de-energise and earth; positively confirm dead)"
  is5216: "IS 5216 (Part 1):1982 Recommendations on safety procedures and practices in electrical work, cl. 3 and 5.1 (permit to work; isolate, prove dead, earth)"
  is694: "IS 694:2010 PVC insulated cables, cl. 12.1.1 (green-and-yellow core for protective earth)"
  dgt1: "DGT Electrician CTS 3.0 (Aug 2025), LO1 (PSS/N9490): safety, fire fighting, elementary first aid, rescue and artificial respiration"
  dgt2: "DGT Electrician CTS 3.0, LO2 (PSS/N9491): wire joints, crimping lugs, insulation resistance with megger"
  dgt3: "DGT Electrician CTS 3.0, LO3 (PSS/N9492): Ohm's law, series and parallel circuits, open and short circuits (answer is standard physics)"
  dgt5: "DGT Electrician CTS 3.0, LO5 (PSS/N9494): wiring, MCB/ELCB/RCCB, grading of cables, voltage drop, load estimation"
  dgt6: "DGT Electrician CTS 3.0, LO6 (PSS/N9495): pipe and plate earthing, earth resistance with earth tester"
  dgt8: "DGT Electrician CTS 3.0, LO8 (PSS/N9496): multimeter, tong tester and other measuring instruments"
items:
  # ---- CON/N0602 tools and instruments -------------------------------------------------------
  - id: el-001
    nos: CON/N0602
    pc_refs: [CON/N0602.PC8]
    sources: [qp, dgt2]
    difficulty_prior: -0.5
    stem: {en: "Which instrument is used to measure the insulation resistance of a cable?", hi: "केबल का इंसुलेशन रेज़िस्टेंस नापने के लिए कौन-सा यंत्र इस्तेमाल होता है?"}
    options:
      - {en: "Megger (insulation tester)", hi: "मेगर (इंसुलेशन टेस्टर)"}
      - {en: "Energy meter", hi: "एनर्जी मीटर"}
      - {en: "Tong tester", hi: "टोंग टेस्टर"}
      - {en: "Neon line tester", hi: "नियॉन लाइन टेस्टर"}
    answer: 0
    explanation: {en: "A megger applies a test voltage and reads the insulation resistance in megohms.", hi: "मेगर टेस्ट वोल्टेज देकर इंसुलेशन रेज़िस्टेंस मेगा-ओम में बताता है।"}
  - id: el-002
    nos: CON/N0602
    pc_refs: [CON/N0602.PC10]
    sources: [qp, dgt8]
    difficulty_prior: -0.3
    stem: {en: "You need to measure the current flowing in a wire without disconnecting it. Which instrument do you use?", hi: "तार को खोले बिना उसमें बहने वाला करंट नापना है। कौन-सा यंत्र लेंगे?"}
    options:
      - {en: "Tong tester (clamp meter)", hi: "टोंग टेस्टर (क्लैम्प मीटर)"}
      - {en: "Megger", hi: "मेगर"}
      - {en: "Earth tester", hi: "अर्थ टेस्टर"}
      - {en: "Wire gauge", hi: "वायर गेज"}
    answer: 0
    explanation: {en: "A tong tester clamps around one conductor and reads its current; the circuit stays connected.", hi: "टोंग टेस्टर एक तार के चारों ओर लगाकर करंट पढ़ता है; सर्किट जुड़ा रहता है।"}
  - id: el-003
    nos: CON/N0602
    pc_refs: [CON/N0602.PC1]
    sources: [qp]
    difficulty_prior: -1.5
    stem: {en: "What should you do before using a power drill?", hi: "पावर ड्रिल इस्तेमाल करने से पहले क्या करना चाहिए?"}
    options:
      - {en: "Check the cable, plug and body for damage", hi: "केबल, प्लग और बॉडी में टूट-फूट जाँचें"}
      - {en: "Remove the plug's earth pin so it fits any socket", hi: "प्लग का अर्थ पिन निकाल दें ताकि हर सॉकेट में लगे"}
      - {en: "Run it in water to cool it", hi: "ठंडा करने के लिए पानी में चलाएँ"}
      - {en: "Nothing, power tools need no checks", hi: "कुछ नहीं, पावर औज़ार को जाँच की ज़रूरत नहीं"}
    answer: 0
    explanation: {en: "The qualification requires basic checks on power tools before use; a damaged lead can give a shock.", hi: "योग्यता में उपयोग से पहले पावर औज़ार की बुनियादी जाँच ज़रूरी है; ख़राब तार से करंट लग सकता है।"}
  - id: el-004
    nos: CON/N0602
    pc_refs: [CON/N0602.PC4]
    sources: [qp, dgt2]
    difficulty_prior: 0.0
    stem: {en: "Which tool measures the size (diameter) of a wire?", hi: "तार का साइज़ (मोटाई) किस औज़ार से नापते हैं?"}
    options:
      - {en: "Wire gauge or micrometer", hi: "वायर गेज या माइक्रोमीटर"}
      - {en: "Line tester", hi: "लाइन टेस्टर"}
      - {en: "Spirit level", hi: "स्पिरिट लेवल"}
      - {en: "Tong tester", hi: "टोंग टेस्टर"}
    answer: 0
    explanation: {en: "Conductor size is measured with a wire gauge (SWG/metric) or a micrometer.", hi: "तार का साइज़ वायर गेज (SWG/मीट्रिक) या माइक्रोमीटर से नापा जाता है।"}
  - id: el-005
    nos: CON/N0602
    pc_refs: [CON/N0602.PC2]
    sources: [dgt2]
    difficulty_prior: 0.3
    stem: {en: "Which tool is used to fix a cable lug firmly onto a stranded wire?", hi: "मल्टी-स्ट्रैंड तार पर केबल लग मज़बूती से लगाने के लिए कौन-सा औज़ार है?"}
    options:
      - {en: "Crimping tool", hi: "क्रिम्पिंग टूल"}
      - {en: "Hacksaw", hi: "हैक्सॉ"}
      - {en: "Pipe wrench", hi: "पाइप रिंच"}
      - {en: "Line tester", hi: "लाइन टेस्टर"}
    answer: 0
    explanation: {en: "A crimping tool presses the lug onto the conductor for a tight, low-resistance joint.", hi: "क्रिम्पिंग टूल लग को तार पर दबाकर मज़बूत और कम रेज़िस्टेंस वाला जोड़ बनाता है।"}
  - id: el-006
    nos: CON/N0602
    pc_refs: [CON/N0602.PC3]
    sources: [qp, dgt8]
    difficulty_prior: 0.2
    stem: {en: "With the supply switched off, a multimeter on the continuity (beep) setting shows NO continuity across a length of wire. What does this mean?", hi: "सप्लाई बंद करके मल्टीमीटर को कंटिन्यूटी (बीप) पर रखकर तार के दोनों सिरों पर लगाया, पर कंटिन्यूटी नहीं मिली। इसका मतलब?"}
    options:
      - {en: "The wire is broken somewhere (open circuit)", hi: "तार कहीं से टूटा है (ओपन सर्किट)"}
      - {en: "The wire is perfectly fine", hi: "तार बिलकुल ठीक है"}
      - {en: "The wire is short-circuited to earth", hi: "तार अर्थ से शॉर्ट है"}
      - {en: "The supply voltage is too high", hi: "सप्लाई वोल्टेज बहुत ज़्यादा है"}
    answer: 0
    explanation: {en: "No continuity between the two ends of one conductor means an open circuit (a break).", hi: "एक ही तार के दोनों सिरों में कंटिन्यूटी न मिलना ओपन सर्किट (टूटा तार) बताता है।"}
  - id: el-007
    nos: CON/N0602
    pc_refs: [CON/N0602.PC10]
    sources: [dgt6]
    difficulty_prior: 0.6
    stem: {en: "Which instrument measures the resistance of an earth electrode?", hi: "अर्थ इलेक्ट्रोड का रेज़िस्टेंस किस यंत्र से नापते हैं?"}
    options:
      - {en: "Earth tester", hi: "अर्थ टेस्टर"}
      - {en: "Energy meter", hi: "एनर्जी मीटर"}
      - {en: "Neon line tester", hi: "नियॉन लाइन टेस्टर"}
      - {en: "Ammeter in series with the load", hi: "लोड के सीरीज़ में एमीटर"}
    answer: 0
    explanation: {en: "Earth electrode resistance is measured with an earth tester (or a megger with an earth-test function).", hi: "अर्थ इलेक्ट्रोड का रेज़िस्टेंस अर्थ टेस्टर (या अर्थ-टेस्ट वाला मेगर) से नापा जाता है।"}
  # ---- CON/N0603 temporary lighting ----------------------------------------------------------
  - id: el-008
    nos: CON/N0603
    pc_refs: [CON/N0603.PC12, CON/N0603.PC7]
    sources: [qp, cea21]
    difficulty_prior: -1.5
    stem: {en: "Before replacing a burnt-out bulb in a site light fitting, what must you do first?", hi: "साइट की लाइट फ़िटिंग में फ़्यूज़ बल्ब बदलने से पहले सबसे पहले क्या करना है?"}
    options:
      - {en: "Switch off and isolate the supply to that fitting", hi: "उस फ़िटिंग की सप्लाई बंद और अलग करें"}
      - {en: "Wet your hands so the bulb does not slip", hi: "हाथ गीले करें ताकि बल्ब न फिसले"}
      - {en: "Touch the holder to check if it is live", hi: "होल्डर छूकर देखें कि करंट है या नहीं"}
      - {en: "Nothing; bulbs can be changed while live", hi: "कुछ नहीं; बल्ब चालू सप्लाई में बदल सकते हैं"}
    answer: 0
    explanation: {en: "Work on fittings only after the supply is isolated and steps are taken so it cannot be switched on by accident.", hi: "फ़िटिंग पर काम तभी करें जब सप्लाई अलग हो और ग़लती से चालू न हो सके।"}
  - id: el-009
    nos: CON/N0603
    pc_refs: [CON/N0603.PC5]
    sources: [qp]
    difficulty_prior: 0.4
    stem: {en: "Two LV cables are joined with a straight-through joint at a site. How is the joint finished?", hi: "साइट पर दो LV केबल स्ट्रेट-थ्रू जोड़ से जोड़ी गईं। जोड़ को कैसे पूरा करते हैं?"}
    options:
      - {en: "Insulate and secure it, for example with PVC insulation tape", hi: "उसे इंसुलेट करके सुरक्षित करें, जैसे PVC इंसुलेशन टेप से"}
      - {en: "Leave the bare joint open so it can be inspected", hi: "नंगा जोड़ खुला छोड़ दें ताकि देख सकें"}
      - {en: "Cover it with paper", hi: "काग़ज़ से ढक दें"}
      - {en: "Wrap it with a wet cloth", hi: "गीले कपड़े से लपेट दें"}
    answer: 0
    explanation: {en: "The qualification asks for joints to be secured with PVC tape (or another standard method); bare joints are a shock risk.", hi: "योग्यता के अनुसार जोड़ को PVC टेप (या दूसरे मानक तरीके) से सुरक्षित करना है; नंगा जोड़ करंट का ख़तरा है।"}
  - id: el-010
    nos: CON/N0603
    pc_refs: [CON/N0603.PC9]
    sources: [qp]
    difficulty_prior: -0.2
    stem: {en: "Why are cables embedded in walls or floors on a site tagged or marked?", hi: "साइट पर दीवार या फ़र्श में दबी केबलों पर टैग या निशान क्यों लगाते हैं?"}
    options:
      - {en: "So that others do not drill or cut into a live cable by mistake", hi: "ताकि कोई ग़लती से चालू केबल में ड्रिल या कटाई न करे"}
      - {en: "To make the site look tidy only", hi: "सिर्फ़ साइट सुंदर दिखाने के लिए"}
      - {en: "Because tags reduce the electricity bill", hi: "क्योंकि टैग से बिजली का बिल कम होता है"}
      - {en: "Tags are not needed on sites", hi: "साइट पर टैग की ज़रूरत नहीं"}
    answer: 0
    explanation: {en: "Tagging embedded and exposed lines warns other workers where live cables run.", hi: "दबी और खुली लाइनों पर टैग दूसरे कामगारों को बताते हैं कि चालू केबल कहाँ है।"}
  - id: el-011
    nos: CON/N0603
    pc_refs: [CON/N0603.PC13]
    sources: [qp, dgt8]
    difficulty_prior: 0.3
    stem: {en: "A row of site lights is off. The supply at the board is present. What is a sensible first test?", hi: "साइट की एक लाइन की लाइटें बंद हैं। बोर्ड पर सप्लाई आ रही है। पहला सही टेस्ट क्या है?"}
    options:
      - {en: "Isolate the circuit and check continuity of the wiring and joints with a multimeter", hi: "सर्किट अलग करके मल्टीमीटर से वायरिंग और जोड़ों की कंटिन्यूटी जाँचें"}
      - {en: "Replace every fitting at once", hi: "एक साथ सारी फ़िटिंग बदल दें"}
      - {en: "Increase the MCB rating", hi: "MCB की रेटिंग बढ़ा दें"}
      - {en: "Touch each joint to feel for current", hi: "हर जोड़ छूकर करंट महसूस करें"}
    answer: 0
    explanation: {en: "Tracing a power interruption means testing continuity along the circuit, with the supply isolated.", hi: "बिजली रुकने की वजह ढूँढ़ने के लिए सप्लाई अलग करके सर्किट में कंटिन्यूटी जाँचते हैं।"}
  - id: el-012
    nos: CON/N0603
    pc_refs: [CON/N0603.PC15]
    sources: [qp, dgt5]
    difficulty_prior: 0.8
    stem: {en: "An MCB on a lighting circuit keeps tripping. What should you NOT do?", hi: "लाइटिंग सर्किट का MCB बार-बार ट्रिप होता है। क्या नहीं करना चाहिए?"}
    options:
      - {en: "Fit a higher-rated MCB so it stops tripping", hi: "ज़्यादा रेटिंग का MCB लगा दें ताकि ट्रिप न हो"}
      - {en: "Look for a short circuit or overload", hi: "शॉर्ट सर्किट या ओवरलोड ढूँढ़ें"}
      - {en: "Check the load connected to the circuit", hi: "सर्किट पर लगा लोड जाँचें"}
      - {en: "Test the insulation of the circuit", hi: "सर्किट का इंसुलेशन जाँचें"}
    answer: 0
    explanation: {en: "Tripping is a warning. A bigger MCB lets the wire overheat; find and fix the fault instead.", hi: "ट्रिप होना चेतावनी है। बड़ा MCB लगाने से तार गरम होगा; ख़राबी ढूँढ़कर ठीक करें।"}
  - id: el-013
    nos: CON/N0603
    pc_refs: [CON/N0603.PC2]
    sources: [dgt5]
    difficulty_prior: 0.9
    stem: {en: "What happens if a cable is too thin for the current it carries?", hi: "अगर केबल उसमें बहने वाले करंट के हिसाब से पतली हो तो क्या होगा?"}
    options:
      - {en: "It overheats, which can damage the insulation and cause a fire", hi: "वह गरम होगी, इंसुलेशन ख़राब हो सकता है और आग लग सकती है"}
      - {en: "It works better because thin wire is lighter", hi: "बेहतर चलेगी क्योंकि पतला तार हल्का है"}
      - {en: "The voltage at the load rises", hi: "लोड पर वोल्टेज बढ़ जाएगा"}
      - {en: "Nothing changes", hi: "कुछ नहीं बदलेगा"}
    answer: 0
    explanation: {en: "Each cable size has a current rating; above it the conductor overheats and the voltage drop also grows.", hi: "हर केबल साइज़ की करंट रेटिंग होती है; उससे ज़्यादा करंट पर तार गरम होता है और वोल्टेज ड्रॉप भी बढ़ता है।"}
  - id: el-014
    nos: CON/N0603
    pc_refs: [CON/N0603.PC16]
    sources: [qp]
    difficulty_prior: 1.0
    stem: {en: "A diesel generator supplies temporary site lighting. How is its maintenance done?", hi: "डीज़ल जनरेटर साइट की अस्थायी लाइटिंग चलाता है। उसकी देखभाल कैसे की जाती है?"}
    options:
      - {en: "Preventive maintenance at scheduled intervals", hi: "तय समय पर निवारक (प्रिवेंटिव) रखरखाव"}
      - {en: "Only after it breaks down", hi: "सिर्फ़ ख़राब होने के बाद"}
      - {en: "Never; generators need no maintenance", hi: "कभी नहीं; जनरेटर को रखरखाव की ज़रूरत नहीं"}
      - {en: "By running it without oil", hi: "बिना तेल चलाकर"}
    answer: 0
    explanation: {en: "The qualification asks for preventive maintenance of site generators at scheduled intervals.", hi: "योग्यता में साइट जनरेटर का तय समय पर निवारक रखरखाव माँगा गया है।"}
  # ---- CON/N0604 wiring in buildings ---------------------------------------------------------
  - id: el-015
    nos: CON/N0604
    pc_refs: [CON/N0604.PC2]
    sources: [cea17, dgt5]
    difficulty_prior: 0.0
